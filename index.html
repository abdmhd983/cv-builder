<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة الاحترافية لبناء وتحميل السير الذاتية | Pro CV Builder</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --dark-color: #1f2937;
            --light-bg: #f8fafc;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--dark-color);
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 1.6rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--dark-color);
        }

        /* حقول إدخال قياسية تجبر الهاتف على فتح لوحة المفاتيح فوراً عند اللمس */
        .cv-input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            color: #000000;
            background-color: #ffffff;
            outline: none;
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        .cv-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .action-btn:hover {
            background: #059669;
        }

        .ad-space {
            background-color: #f1f5f9;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            text-align: center;
            padding: 15px;
            margin: 20px 0;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
        }

        @media print {
            .ad-space, .action-btn, label {
                display: none !important;
            }
            body {
                background: #ffffff;
                padding: 0;
            }
            .container {
                border: none;
                box-shadow: none;
                padding: 0;
            }
            .cv-input {
                border: none !important;
                padding: 5px 0 !important;
                font-size: 1.2rem;
                background: transparent !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📄 منصة السير الذاتية الاحترافية العامة</h2>

        <div class="ad-space">
            <span>[مساحة إعلانية علوية - Place Adsterra Header Code Here]</span>
        </div>

        <!-- حقول كتابة السيرة الذاتية التفاعلية -->
        <div class="form-group">
            <label>الاسم الكامل:</label>
            <input type="text" class="cv-input" placeholder="اكتب اسمك الكامل هنا">
        </div>

        <div class="form-group">
            <label>المسمى الوظيفي:</label>
            <input type="text" class="cv-input" placeholder="مثال: مطور برمجيات / خريج تجارة">
        </div>

        <div class="form-group">
            <label>البريد الإلكتروني:</label>
            <input type="email" class="cv-input" placeholder="example@mail.com">
        </div>

        <div class="form-group">
            <label>رقم الهاتف:</label>
            <input type="tel" class="cv-input" placeholder="+963 ...">
        </div>

        <div class="form-group">
            <label>المدينة والدولة:</label>
            <input type="text" class="cv-input" placeholder="دمشق، سوريا">
        </div>

        <div class="form-group">
            <label>النبذة الشخصية (عني):</label>
            <textarea class="cv-input" rows="4" placeholder="اكتب نبذة مختصرة عن خبراتك ومهاراتك..."></textarea>
        </div>

        <div class="form-group">
            <label>التعليم والشهادات:</label>
            <textarea class="cv-input" rows="3" placeholder="اذكر شهاداتك الجامعية وسنوات الدراسة..."></textarea>
        </div>

        <div class="form-group">
            <label>الخبرات المهنية السابقة:</label>
            <textarea class="cv-input" rows="4" placeholder="اذكر الشركات والوظائف التي عملت بها سابقاً..."></textarea>
        </div>

        <div class="form-group">
            <label>المهارات الرئيسية:</label>
            <input type="text" class="cv-input" placeholder="مثال: مهارة 1، مهارة 2، مهارة 3">
        </div>

        <button class="action-btn" onclick="window.print()">📥 تحميل وطباعة السيرة الذاتية PDF</button>

        <div class="ad-space" style="min-height: 200px;">
            <span>[إعلان سفلي - Place Adsterra Footer Code Here]</span>
        </div>
    </div>
<script data-cfasync="false" src="https://bauval.org/14/689a252086a22d065edb85981f00d4b8"></script>


</body>
</html>
