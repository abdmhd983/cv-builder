<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة الاحترافية العالمية لبناء السير الذاتية | Pro CV Builder</title>
    <!-- خطوط جوجل العالمية الفخمة -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0f172a; /* كحلي ملكي عميق */
            --secondary-color: #1e293b; /* كحلي وسيط */
            --accent-color: #b45309; /* لمسة ذهبية برونزية كلاسيكية */
            --bg-light: #f8fafc; /* خلفية مريحة جداً للعين */
            --text-dark: #334155;
            --shadow-premium: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 10px 10px -6px rgba(15, 23, 42, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* حاوية الإعلان العلوي الخارقة - معزولة برمجياً بالكامل لمنع أي تشوه */
        .header-ad-container {
            width: 100%;
            background: #ffffff;
            padding: 15px 0;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .main-wrapper {
            display: flex;
            flex: 1;
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 30px 20px;
            gap: 30px;
        }

        /* لوحة التحكم الجانبية الفخمة */
        .control-sidebar {
            width: 340px;
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow-premium);
            display: flex;
            flex-direction: column;
            gap: 25px;
            height: fit-content;
            position: sticky;
            top: 30px;
            transition: var(--transition);
        }

        .sidebar-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.2);
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.3);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid #e2e8f0;
            color: var(--text-dark);
        }

        .btn-outline:hover {
            background-color: var(--bg-light);
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        /* مساحة الإعلان الجانبي الاحترافية والمحمية داخل لوحة التحكم */
        .sidebar-ad-container {
            background: #fafafa;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            min-height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: var(--transition);
        }

        /* ورقة المعاينة الحية للسيرة الذاتية (A4 السحرية) */
        .cv-preview-container {
            flex: 1;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: var(--shadow-premium);
            padding: 60px 70px;
            position: relative;
            max-width: 850px;
            min-height: 1150px;
            transition: var(--transition);
        }

        /* تنسيق الهيكل الخاص بالسيرة الذاتية (عصري كلاسيكي فخم) */
        .cv-header {
            text-align: center;
            border-bottom: 3px double var(--primary-color);
            padding-bottom: 30px;
            margin-bottom: 40px;
            transition: var(--transition);
        }

        .cv-name {
            font-family: 'Playfair Display', 'Cairo', serif;
            font-size: 2.75rem;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 1px;
            outline: none;
            margin-bottom: 8px;
            transition: var(--transition);
        }

        .cv-title {
            font-size: 1.3rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            outline: none;
        }

        .cv-contact-info {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #64748b;
        }

        .contact-item {
            outline: none;
        }

        .cv-section {
            margin-bottom: 35px;
        }

        .section-title {
            font-family: 'Playfair Display', 'Cairo', serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary-color);
            text-transform: uppercase;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            letter-spacing: 0.5px;
            transition: var(--transition);
        }

        .section-title::after {
            content: '';
            flex: 1;
            margin-right: 20px;
            height: 1px;
            background: #e2e8f0;
        }

        .cv-editable-content {
            outline: none;
            line-height: 1.9;
            font-size: 1rem;
            color: #475569;
            white-space: pre-line;
        }

        /* تفاعل ناعم عند وقوف المستخدم على النصوص لتعديلها */
        [contenteditable="true"] {
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid transparent;
            transition: var(--transition);
        }

        [contenteditable="true"]:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            cursor: pointer;
        }
        
        [contenteditable="true"]:focus {
            background-color: #ffffff;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.15);
        }

        /* 🖨️ هندسة نظام الطباعة الصارم: لإخفاء لوحة التحكم والإعلانات بالكامل واستخراج ورقة بيضاء خارقة */
        @media print {
            body {
                background: #ffffff !important;
            }
            .header-ad-container, .control-sidebar {
                display: none !important;
            }
            .main-wrapper {
                padding: 0 !important;
                margin: 0 !important;
                max-width: 100% !important;
            }
            .cv-preview-container {
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
                border: none !important;
                width: 100% !important;
                max-width: 100% !important;
            }
            [contenteditable="true"] {
                padding: 0 !important;
                background: transparent !important;
                border: none !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- حاوية الإعلان العلوي المدمج بها كود Adsterra الخاص بك -->
    <div class="header-ad-container">
        <script data-cfasync="false" src="https://bauval.org/14/689a252086a22d065edb85981f00d4b8"></script>
    </div>

    <div class="main-wrapper">
        
        <!-- لوحة التحكم الاحترافية الجانبية -->
        <aside class="control-sidebar">
            <h2 class="sidebar-title">أدوات التحكم بالمنصة</h2>
            
            <button class="btn btn-primary" onclick="window.print()">
                📥 تحميل وطباعة السيرة (PDF)
            </button>
            
            <button class="btn btn-outline" onclick="changeTheme('modern')">
                👔 المظهر العصري
            </button>
            <button class="btn btn-outline" onclick="changeTheme('classic')">
                📜 القالب الكلاسيكي الفخم
            </button>
            
            <!-- مساحة الإعلان الجانبي المدمج بها كود Adsterra الخاص بك أيضاً لمضاعفة الأرباح -->
            <div class="sidebar-ad-container">
                <script data-cfasync="false" src="https://bauval.org/14/689a252086a22d065edb85981f00d4b8"></script>
            </div>
        </aside>

        <!-- ورقة السيرة الذاتية الأنيقة (تعديل حي فوري بمجرد النقر والضغط) -->
        <main class="cv-preview-container" id="cvPaper">
            
            <header class="cv-header" id="cvHeaderBlock">
                <div class="cv-name" contenteditable="true" id="fullNameField">الاسم الكامل هنا</div>
                <div class="cv-title" contenteditable="true" id="jobTitleField">المسمى الوظيفي المستهدف</div>
